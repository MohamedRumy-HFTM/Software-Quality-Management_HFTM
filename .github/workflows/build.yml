name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Projektdateien auf den Build-Server laden.
      - name: Check out source code
        uses: actions/checkout@v7

      # Java 17 bereitstellen und heruntergeladene Maven-Abhängigkeiten cachen.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # Kompilieren, Unit-Tests ausführen, JAR bauen und Coverage-Bericht erstellen.
      - name: Build and test with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      # Auch bei fehlgeschlagenen Tests die vorhandenen Testberichte sichern.
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
